server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/ld+json
        image/svg+xml;

    # ── Seguridad ─────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # ── El HTML nunca se cachea ───────────────────────────────
    #    Así los cambios de texto se ven de inmediato tras el deploy.
    #    Aplica a index.html, privacidad.html y terminos.html.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── CSS y JS: siempre revalidados ─────────────────────────
    #    NO se puede usar "immutable" aquí: los nombres de archivo son
    #    fijos (styles.css, main.js), así que el navegador se quedaría
    #    con la versión vieja para siempre mientras el HTML sí se
    #    actualiza — y la página se rompe.
    #    Con ETag el navegador pregunta y recibe un 304 vacío si no
    #    cambió: cuesta un viaje mínimo y nunca sirve algo obsoleto.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # ── Imágenes y fuentes: caché moderada ────────────────────
    #    Cambian rara vez. Una semana, pero revalidando al vencer.
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ── Rutas ─────────────────────────────────────────────────
    #    $uri.html permite URLs limpias: /privacidad y /terminos
    #    funcionan igual que /privacidad.html y /terminos.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Salud del contenedor (útil para EasyPanel)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /index.html;
}
